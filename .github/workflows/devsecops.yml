name: DevSecOps Pipeline

on:
  push:
    branches: ["main"]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # Checkout Code
      # ---------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------------------
      # Setup Node
      # ---------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ---------------------------
      # Install Dependencies
      # ---------------------------
      - name: Install Dependencies
        run: npm install

      # ---------------------------
      # Dependency Scan
      # ---------------------------
      - name: Dependency Scan
        run: npm audit --audit-level=high || true

      # ---------------------------
      # Build Docker Image
      # ---------------------------
      - name: Build Docker Image
        run: docker build -t nodegoat-secure .

      # ---------------------------
      # Install Trivy
      # ---------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # ---------------------------
      # Container Scan
      # ---------------------------
      - name: Scan Docker Image
        run: |
          trivy image --severity HIGH,CRITICAL nodegoat-secure

      # ---------------------------
      # Login to Docker Hub
      # ---------------------------
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # ---------------------------
      # Tag Image
      # ---------------------------
      - name: Tag Docker Image
        run: |
          docker tag nodegoat-secure ${{ secrets.DOCKER_USERNAME }}/nodegoat-secure:latest

      # ---------------------------
      # Push Image
      # ---------------------------
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nodegoat-secure:latest

      # ---------------------------
      # Done
      # ---------------------------
      - name: Done
        run: echo "Pipeline Completed Successfully"