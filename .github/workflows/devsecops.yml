name: DevSecOps Pipeline

on:
  push:
    branches: ["main"]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # Checkout Code
      # ---------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------------------
      # Setup Node
      # ---------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ---------------------------
      # Install Dependencies
      # ---------------------------
      - name: Install Dependencies
        run: npm install

      # ---------------------------
      # SCA - Dependency Scan
      # ---------------------------
      - name: Dependency Scan (npm audit)
        run: npm audit --audit-level=high || true

      # ---------------------------
      # SAST - SonarQube Scan
      # ---------------------------
      - name: SonarQube Scan
        run: |
          docker run --rm \
            -e SONAR_HOST_URL="http://host.docker.internal:9000" \
            -e SONAR_LOGIN="${{ secrets.SONAR_TOKEN }}" \
            -v "${{ github.workspace }}:/usr/src" \
            sonarsource/sonar-scanner-cli

      # ---------------------------
      # Build Docker Image
      # ---------------------------
      - name: Build Docker Image
        run: docker build -t nodegoat-secure .

      # ---------------------------
      # Install Trivy
      # ---------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # ---------------------------
      # Container Scan
      # ---------------------------
      - name: Scan Docker Image (Trivy)
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 0 nodegoat-secure

      # ---------------------------
      # Pipeline Completed
      # ---------------------------
      - name: Done
        run: echo "DevSecOps Pipeline Completed Successfully"