name: DevSecOps Pipeline

on:
  push:
    branches: ["main"]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      # ✅ Latest checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ Latest Node setup (no matrix)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ✅ Install dependencies
      - name: Install Dependencies
        run: npm install

      # ✅ Dependency Scan
      - name: npm audit
        run: npm audit --audit-level=high || true

      # ✅ Build Docker image
      - name: Build Docker Image
        run: docker build -t nodegoat-secure .

      # ✅ Trivy Scan (direct docker method)
      - name: Scan Image with Trivy
        run: |
          docker run --rm aquasec/trivy:0.50.1 image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            nodegoat-secure
